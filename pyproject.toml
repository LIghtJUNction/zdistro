[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zdistro"
version = "0.1.0"
description = "One manifest for language builds, native packages and verified delivery artifacts"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LIghtJUNction"}]
readme = "README.md"
dependencies = []

[project.scripts]
zdistro = "zdistro.cli:main"

[project.urls]
Repository = "https://github.com/LIghtJUNction/zdistro"

[tool.setuptools]
packages = ["zdistro"]
